- id: W4-OB-BOUNDARY
  role: TLC HR Lead
  brd:
  - HR-OB-12
  - HR-OB-14
  uat: &id011
  - UAT-HR-OB-12
  - UAT-HR-OB-14
  automated_evidence: tests/unit/test_lifecycle.py
  given: The employee calendar includes real holidays and factory working weekends.
  when: A probation reaches 180/60/30 calendar days or six actual working days, or
    repeats the same job.
  then: Exact legal limits pass; the next day and repeated probation are rejected.
    Completion requires evidence confirmations.
  title: Exact legal limits pass; the next day and repeated probation are rejected.
    Completion requires evidence confirmations.
  story: 'TLC HR Lead: A probation reaches 180/60/30 calendar days or six actual working
    days, or repeats the same job. → Exact legal limits pass; the next day and repeated
    probation are rejected. Completion requires evidence confirmations.'
  cases:
  - W4-OB-BOUNDARY
  ac:
  - given: The employee calendar includes real holidays and factory working weekends.
    when: A probation reaches 180/60/30 calendar days or six actual working days,
      or repeats the same job.
    then: Exact legal limits pass; the next day and repeated probation are rejected.
      Completion requires evidence confirmations.
    cases:
    - W4-OB-BOUNDARY
