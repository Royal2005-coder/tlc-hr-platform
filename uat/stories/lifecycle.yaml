coverage_notes:
- Boundary stories are pure domain cases, not claims of recorded browser execution.
- Recorded browser stories cover native Desk forms, workflows, validations and permissions
  for contracts, separations and onboardings.
- Recruitment and organization have separate stories and journeys.
