# Điểm vào, phạm vi thấy/làm, ranh giới và người cấp quyền của từng vai trò trên TLC HRM.
# Một nguồn duy nhất: uat/proposal_html.py vẽ bảng này trong deck, tools/publish_tlc_frappe_outline.py đăng lên Outline.
# Ranh giới do server thực thi (DocPerm, User Permission, validate, workflow), không phải ẩn nút trên giao diện.
- role: "Công nhân · Nhân viên văn phòng"
  groups: "Employee Self Service · TLC Self Service"
  entry: "/hrms – App Frappe HR"
  sees: "Chấm công GPS tại cổng, xin nghỉ, trả lời đề nghị tăng ca, đề xuất công tác, xem phiếu lương và giấy tờ của mình, khảo sát ẩn danh"
  bounds: "Chỉ thấy hồ sơ của chính mình; không thấy lương người khác; không duyệt được đơn mình đã tạo"
  grants: "HR đề xuất và ký danh sách vai trò theo chức danh; IT chỉ gán đúng phiếu đã duyệt"
- role: "Trưởng nhà máy · Trưởng bộ phận"
  groups: "TLC Line Manager"
  entry: "Desk – workspace TLC Quản lý"
  sees: "Duyệt đơn của người thuộc quyền, chốt kỳ công nhà máy mình, danh sách chờ, công và lương trong phạm vi quản lý"
  bounds: "User Permission giới hạn theo từng nhà máy; không sửa được workflow, quyền hay dữ liệu đã ký"
  grants: "HR duyệt phạm vi quản lý (nhà máy, phòng); IT áp giới hạn dữ liệu"
- role: "Chuyên viên nhân sự"
  groups: "HR User"
  entry: "Desk – workspace TLC Nhân sự"
  sees: "Hồ sơ nhân sự, hợp đồng và người phụ thuộc, cấp và điều chỉnh phép, tăng ca, công tác, tạm ứng, tài sản, đào tạo"
  bounds: "Không ký bảng lương, không sửa quyết định lương; không xóa được chứng từ đã submit"
  grants: "HR Lead phân công trong bộ phận; IT không tự thêm người vào nhóm nghiệp vụ"
- role: "Chuyên viên tính lương"
  groups: "TLC Payroll"
  entry: "Desk – workspace TLC Tác nghiệp lương"
  sees: "Chạy Payroll Entry, lập phiếu lương, điều chỉnh giữa kỳ, báo cáo thuế, BHXH, sổ lao động"
  bounds: "Không tự phê duyệt quyết định lương mình nhập; chỉ đọc phần đã được ký; trường lương ở permlevel 1"
  grants: "HR Lead đề xuất, IT gán quyền lương"
- role: "Giám đốc nhân sự · HR Lead"
  groups: "TLC HR Lead · HR Manager"
  entry: "Desk – workspace TLC Nhân sự"
  sees: "Duyệt bậc hai mọi quy trình nhân sự, quyết định tăng lương, thưởng, điều chuyển, định biên, tuyển dụng"
  bounds: "Không vào khu vực Quản trị kỹ thuật; không đổi cấu hình hệ thống, không xóa nhật ký"
  grants: "Là chủ quy trình nhân sự, nên mọi thay đổi quyền nghiệp vụ phải do người này ký đề nghị"
- role: "Kế toán · Tài chính"
  groups: "Accounts User · Accounts Manager"
  entry: "Desk – workspace TLC Kế toán chi trả"
  sees: "Chi tạm ứng và lương bằng chứng từ ngân hàng, đối soát quyết toán, xác nhận đã nhận, khóa sổ thanh toán"
  bounds: "Không sửa công thức lương hay workflow nhân sự; ghi nhận chứng từ, không duyệt nghỉ phép"
  grants: "HR xác nhận danh tính người nhận; IT gán tài khoản kế toán theo phiếu"
- role: "Tổng giám đốc · CEO"
  groups: "TLC Director"
  entry: "Desk – workspace TLC Điều hành"
  sees: "Ký bảng lương, phê duyệt quyết định lương, thưởng, điều chuyển, duyệt tăng ca và công tác, xem gross/net toàn công ty, hộp thư ký"
  bounds: "Chỉ đọc và phê chuẩn: không tạo hay sửa Salary Structure Assignment, không vào khu vực quản trị kỹ thuật"
  grants: "Không tự cấp quyền cho mình; quyền do HR đề nghị, IT thực thi"
- role: "IT quản trị hệ thống"
  groups: "System Manager · TLC Role Admin"
  entry: "Desk – workspace TLC Quản trị kỹ thuật"
  sees: "User, Role, Level, quyền theo dữ liệu, import, backup, cấu hình YAML, theo dõi job và log"
  bounds: "Không đổi luật lương hay quy trình nghiệp vụ ngoài phạm vi HR đã duyệt; không dùng quyền kỹ thuật để xem dữ liệu lương"
  grants: "Chỉ thực thi phiếu phân quyền HR đã ký; mọi thao tác lưu nhật ký hệ thống"
