apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mariadb, namespace: tlc-hr}
spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 10Gi}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mariadb, namespace: tlc-hr}
spec:
  serviceName: mariadb
  replicas: 1
  selector: {matchLabels: {app: mariadb}}
  template:
    metadata: {labels: {app: mariadb}}
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8
          args: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake, --innodb-buffer-pool-size=256M]
          env:
            - {name: MARIADB_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: tlc-hr, key: db-root-password}}}
          ports: [{containerPort: 3306}]
          readinessProbe: {exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {memory: 384Mi, cpu: 100m}, limits: {memory: 1Gi, cpu: "2"}}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: mariadb}}]
---
apiVersion: v1
kind: Service
metadata: {name: mariadb, namespace: tlc-hr}
spec: {selector: {app: mariadb}, ports: [{port: 3306}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis-cache, namespace: tlc-hr}
spec:
  selector: {matchLabels: {app: redis-cache}}
  template:
    metadata: {labels: {app: redis-cache}}
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          args: [--maxmemory, 96mb, --maxmemory-policy, allkeys-lru, --save, ""]
          resources: {requests: {memory: 48Mi}, limits: {memory: 160Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis-cache, namespace: tlc-hr}
spec: {selector: {app: redis-cache}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis-queue, namespace: tlc-hr}
spec:
  selector: {matchLabels: {app: redis-queue}}
  template:
    metadata: {labels: {app: redis-queue}}
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          resources: {requests: {memory: 32Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis-queue, namespace: tlc-hr}
spec: {selector: {app: redis-queue}, ports: [{port: 6379}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sites, namespace: tlc-hr}
spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 5Gi}}}
