# Mail catcher of the demo: Frappe sends the leave notifications here; read them at http://100.77.166.27:30082
apiVersion: apps/v1
kind: Deployment
metadata: {name: mailpit, namespace: tlc-hr, labels: {app: mailpit}}
spec:
  selector: {matchLabels: {app: mailpit}}
  template:
    metadata: {labels: {app: mailpit}}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21
          env: [{name: MP_MAX_MESSAGES, value: "2000"}]
          ports: [{containerPort: 1025}, {containerPort: 8025}]
          resources: {requests: {memory: 32Mi, cpu: 10m}, limits: {memory: 128Mi, cpu: 500m}}
---
apiVersion: v1
kind: Service
metadata: {name: mailpit, namespace: tlc-hr}
spec:
  selector: {app: mailpit}
  ports: [{name: smtp, port: 1025}, {name: web, port: 8025}]
---
apiVersion: v1
kind: Service
metadata: {name: mailpit-web, namespace: tlc-hr}
spec:
  type: NodePort
  selector: {app: mailpit}
  ports: [{port: 8025, nodePort: 30082}]
