apiVersion: v1
kind: Namespace
metadata:
  name: tlc-hr
  labels: {app.kubernetes.io/part-of: tlc-hr}
---
# Keeps the demo inside its share of the single 16 GB node (Velura, Keycloak and observability run there too).
apiVersion: v1
kind: ResourceQuota
metadata: {name: tlc-hr, namespace: tlc-hr}
spec:
  hard: {requests.memory: 3Gi, limits.memory: 8Gi, requests.cpu: "4", persistentvolumeclaims: "4"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: tlc-hr, namespace: tlc-hr}
spec:
  limits:
    - type: Container
      default: {memory: 256Mi, cpu: 500m}
      defaultRequest: {memory: 64Mi, cpu: 50m}
