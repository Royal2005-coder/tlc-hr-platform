# Read-only web page of the UAT evidence (videos, screenshots, Excel sheet) for the tailnet: http://100.77.166.27:30081
apiVersion: apps/v1
kind: Deployment
metadata: {name: uat-evidence, namespace: tlc-hr, labels: {app: uat-evidence}}
spec:
  selector: {matchLabels: {app: uat-evidence}}
  template:
    metadata: {labels: {app: uat-evidence}}
    spec:
      # The evidence lives on the ai1 hostPath; without this pin the pod can land on the other node and serve an empty page.
      nodeSelector: {kubernetes.io/hostname: ai1-optiplex-tower-plus-7020}
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {memory: 16Mi, cpu: 10m}, limits: {memory: 64Mi, cpu: 500m}}
          volumeMounts: [{name: out, mountPath: /usr/share/nginx/html, readOnly: true}]
      volumes:
        - name: out
          hostPath: {path: /home/ai1/tlc-hr/tlc-hr-platform/uat/out, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata: {name: uat-evidence, namespace: tlc-hr}
spec: {type: NodePort, selector: {app: uat-evidence}, ports: [{port: 80, nodePort: 30081}]}
